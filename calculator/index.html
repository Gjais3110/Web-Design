<!DOCTYPE html>
<html lang="en">
    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="shortcut icon" href="./icons8-calculator.gif" type="image/x-icon">

        <link rel="stylesheet" href="./style.css">

        <title>Calculator</title>

    </head>
    <body>

        <h1>This calculator can only perform 1 operation at a time. Do not enter equations!!</h1>

        <div id="container">
            <div id="screen">
                <p id = "datascreen"></p>
                <br>
                <p id = "resscreen"></p>
            </div>
            <button id = "key1">1</button>
            <button id = "key2">2</button>
            <button id = "key3">3</button>
            <button id = "key4">4</button>
            <button id = "key5">5</button>
            <button id = "key6">6</button>
            <button id = "key7">7</button>
            <button id = "key8">8</button>
            <button id = "key9">9</button>
            <button id = "key0">0</button>
            <button id = "keyadd">+</button>
            <button id = "key-">-</button>
            <button id = "keyX">X</button>
            <button id = "key/">/</button>
            <button id = "keyequal">=</button>
            <button id = "keyreset">CLR</button>
        </div>

        <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>

        <script src="./testing.js"></script> 

    </body>

</html>
